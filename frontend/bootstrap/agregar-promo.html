<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregar Promoción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <a href="promos-admin.html" class="btn btn-outline-secondary mb-3">← Volver</a>
    <h2 class="text-danger fw-bold mb-4">Agregar nueva promoción</h2>

    <form>
      <div class="mb-3">
        <label for="tituloPromo" class="form-label">Título</label>
        <input type="text" class="form-control" id="tituloPromo" placeholder="Ej: 2x1 en hamburguesas">
      </div>

      <div class="mb-3">
        <label for="descripcionPromo" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcionPromo" rows="3" placeholder="Texto de la promoción..."></textarea>
      </div>

      <div class="mb-3">
        <label for="fechaPromo" class="form-label">Fecha</label>
        <input type="date" class="form-control" id="fechaPromo">
      </div>

      <button type="submit" class="btn btn-danger">Agregar promoción</button>
    </form>
  </div>

</body>
</html>
