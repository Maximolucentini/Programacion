<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Administrador - PoissonFood</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #ffffff;
    }

    .admin-container {
      padding: 2rem 1rem;
    }

    .admin-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #666;
    }

    .admin-buttons .btn {
      background-color: #ff3d3d;
      color: white;
      font-weight: 500;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 1rem;
    }

    .admin-buttons .btn:hover {
      background-color: #e63434;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: white;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 60px;
      z-index: 10;
    }

    .bottom-nav a {
      color: #ff3d3d;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container admin-container text-center">
    <!-- Título y perfil -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold">Food</h2>
        <p class="admin-title">Bienvenido Administrador</p>
      </div>
      <img src="https://via.placeholder.com/40" class="rounded-circle" alt="Foto perfil" />
    </div>

   <!-- Botones -->
   <div class="admin-buttons">
    <a href="menu-admin.html" class="btn w-100">Gestión de menú</a>
    <a href="historial-admin.html" class="btn w-100">Historial de pedidos</a>
    <a href="usuarios-admin.html" class="btn w-100">Gestión de usuarios</a>
    <a href="promos-admin.html" class="btn w-100">Gestión promociones</a>
   </div>


  <!-- Menú de navegación inferior -->
  <div class="bottom-nav">
    <a href="#"><i class="fa-solid fa-house"></i></a>
    <a href="#"><i class="fa-solid fa-user"></i></a>
    <a href="#"><i class="fa-solid fa-heart"></i></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
