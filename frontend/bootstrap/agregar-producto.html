<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregar Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <a href="menu-admin.html" class="btn btn-outline-secondary mb-3">← Volver</a>
    <h2 class="text-danger fw-bold mb-4">Agregar nuevo producto</h2>

    <form>
      <div class="mb-3">
        <label for="nombreProducto" class="form-label">Nombre del producto</label>
        <input type="text" class="form-control" id="nombreProducto" placeholder="Ej: Hamburguesa clásica">
      </div>

      <div class="mb-3">
        <label for="descripcionProducto" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcionProducto" rows="3" placeholder="Descripción del producto..."></textarea>
      </div>

      <div class="mb-3">
        <label for="precioProducto" class="form-label">Precio ($)</label>
        <input type="number" class="form-control" id="precioProducto" placeholder="Ej: 2500">
      </div>

      <div class="mb-3">
        <label for="imagenProducto" class="form-label">URL de imagen</label>
        <input type="text" class="form-control" id="imagenProducto" placeholder="https://ejemplo.com/imagen.jpg">
      </div>

      <button type="submit" class="btn btn-danger">Agregar producto</button>
    </form>
  </div>

</body>
</html>
