<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estado del Pedido - PoissonFood</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .estado-pedido {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .paso {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .paso i {
      font-size: 2rem;
    }

    .paso.completado i {
      color: green;
    }

    .paso.actual i {
      color: orange;
    }

    .paso.pendiente i {
      color: #ccc;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><i class="fa-solid fa-burger"></i> PoissonFood</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Estado del pedido -->
  <div class="container text-center">
    <h2 class="mt-5">Estado de tu pedido</h2>
    <p class="text-muted">Estamos trabajando en tu comida 🍔</p>

    <div class="estado-pedido text-start mx-auto" style="max-width: 500px;">
      <!-- Paso 1 -->
      <div class="paso completado">
        <i class="fa-solid fa-check-circle"></i>
        <span>Pedido realizado</span>
      </div>

      <!-- Paso 2 -->
      <div class="paso actual">
        <i class="fa-solid fa-utensils"></i>
        <span>En preparación</span>
      </div>

      <!-- Paso 3 -->
      <div class="paso pendiente">
        <i class="fa-solid fa-bell-concierge"></i>
        <span>Listo para retirar</span>
      </div>
    </div>

    <a href="menu.html" class="btn btn-outline-primary mt-5">Volver al menú</a>

  </div>

  <!-- Footer -->
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 px-4 border-top mt-5">
    <div class="col-md-4 d-flex align-items-center">
      <span class="mb-3 mb-md-0 text-body-secondary">&copy; 2025 PoissonFood</span>
    </div>
    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
      <li class="ms-3"><a class="text-body-secondary" href="#"><i class="fab fa-twitter"></i></a></li>
      <li class="ms-3"><a class="text-body-secondary" href="#"><i class="fab fa-instagram"></i></a></li>
      <li class="ms-3"><a class="text-body-secondary" href="#"><i class="fab fa-facebook"></i></a></li>
    </ul>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
