<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión de Menú - Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .card-img-top {
      object-fit: cover;
      height: 180px;
    }
    .btn-edit {
      background-color: #3b3b3b;
      color: white;
    }
    .btn-delete {
      background-color: #ff3d3d;
      color: white;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container pt-4">
    <a href="admin.html" class="btn btn-outline-secondary mb-3">
      ← Volver al panel
    </a>
  </div>
  

  <div class="container py-4">
    <h2 class="mb-4 text-center text-danger fw-bold">Editar menú:</h2>

    <div class="row g-4">

      <!-- Producto 1 -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="img/americanburger.jpg" class="card-img-top" alt="Hamburguesa 1" />
          <div class="card-body text-center">
            <h5 class="card-title">Cheeseburger Wendy's Burger</h5>
            <p class="text-warning"><i class="fa-solid fa-star"></i> 4.9 – 25 mins</p>
            <div class="d-flex justify-content-around mt-3">
              <a href="editar-producto.html" class="btn btn-edit">EDITAR</a>
              <button class="btn btn-delete">ELIMINAR</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="img/chickenburger.jpg" class="card-img-top" alt="Hamburguesa 2" />
          <div class="card-body text-center">
            <h5 class="card-title">Hamburger Chicken Burger</h5>
            <p class="text-warning"><i class="fa-solid fa-star"></i> 4.6 – 22 mins</p>
            <div class="d-flex justify-content-around mt-3">
              <a href="editar-producto.html" class="btn btn-edit">EDITAR</a>
              <button class="btn btn-delete">ELIMINAR</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="img/bigburger.jpg" class="card-img-top" alt="Hamburguesa 3" />
          <div class="card-body text-center">
            <h5 class="card-title">Hamburger Veggie Burger</h5>
            <p class="text-warning"><i class="fa-solid fa-star"></i> 4.8 – 14 mins</p>
            <div class="d-flex justify-content-around mt-3">
              <a href="editar-producto.html" class="btn btn-edit">EDITAR</a>
              <button class="btn btn-delete">ELIMINAR</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Botón para agregar producto -->
    <a href="agregar-producto.html"
       class="btn btn-danger rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center"
       style="width: 60px; height: 60px; z-index: 1030;">
      <i class="fa-solid fa-plus fs-4"></i>
    </a>

    

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
