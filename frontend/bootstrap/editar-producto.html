<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editar Producto</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-4">
    <!-- Volver -->
    <a href="menu-admin.html" class="btn btn-outline-secondary mb-3">← Volver</a>

    <!-- Formulario -->
    <h2 class="text-danger fw-bold mb-4">Editar producto</h2>

    <form>
      <div class="mb-3">
        <label for="nombreProducto" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombreProducto" value="Cheeseburger Wendy's Burger">
      </div>

      <div class="mb-3">
        <label for="descripcionProducto" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcionProducto" rows="3">Hamburguesa con queso cheddar, panceta y pan casero.</textarea>
      </div>

      <div class="mb-3">
        <label for="precioProducto" class="form-label">Precio ($)</label>
        <input type="number" class="form-control" id="precioProducto" value="2500">
      </div>

      <button type="submit" class="btn btn-danger">Guardar cambios</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
