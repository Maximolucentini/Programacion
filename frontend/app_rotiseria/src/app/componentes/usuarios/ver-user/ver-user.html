<div class="container-flex content">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <!-- Buscador -->
      <div class="input-group input-group-sm mb-3">
        <span class="input-group-text">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input
          class="form-control"
          placeholder="Buscar usuario..."
          type="text"
          [(ngModel)]="nombre"
          (input)="buscar()"
        />
      </div>

      <!-- Lista de usuarios -->
      <ul class="list-group d-grid gap-2">
        @for (u of arrayFiltred; track u.id) {
          <li class="list-group-item d-flex justify-content-between align-items-start usuario-card">
            <div class="me-2">
              <div class="fw-semibold text-capitalize">
                {{ u.name || 'Sin nombre' }}
              </div>
              <div class="text-muted small">{{ u.email }}</div>

              <div class="mt-1"
                   [class.estado-activo]="u.estado === 'activo'"
                   [class.estado-bloqueado]="u.estado !== 'activo'">
                {{ u.estado === 'activo' ? 'Activo' : 'Bloqueado' }}
              </div>
            </div>

            <div class="d-flex align-items-center">
              <!-- Si está activo, muestro Bloquear -->
              <button *ngIf="u.estado === 'activo'"
                      class="btn btn-danger btn-sm"
                      (click)="bloquear(u)">
                <i class="fa-solid fa-ban me-1"></i> Bloquear
              </button>

              <!-- Si NO está activo, muestro Activar -->
              <button *ngIf="u.estado !== 'activo'"
                      class="btn btn-success btn-sm"
                      (click)="activar(u)">
                <i class="fa-solid fa-check me-1"></i> Activar
              </button>
            </div>
          </li>
        }
      </ul>

      <!-- estados de carga/errores -->
      @if (cargando) {
        <div class="text-center my-3">Cargando…</div>
      }
      @if (error) {
        <div class="alert alert-danger my-3">{{ error }}</div>
      }

    </div>
  </div>
</div>
