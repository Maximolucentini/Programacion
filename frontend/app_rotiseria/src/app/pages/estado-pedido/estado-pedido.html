<app-navbar></app-navbar>

<!-- EMPLEADO: lista de pedidos -->
<ng-container *ngIf="ver; else userView">
  <div class="container text-center">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <a routerLink="/empleado"><i class="fa-solid fa-arrow-left back-icon"></i></a>
      <h5 class="fw-bold m-0 titulo-rojo">Estado de pedidos</h5>
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
    </div>

    <!-- Lista (array) de pedidos -->
    <div class="pedido-card mb-3" *ngFor="let o of orders">
      <div class="d-flex justify-content-between align-items-center">
        <p class="fw-bold m-0">Pedido N°{{ o.id }}</p>
        <small class="text-muted">{{ o.fecha }}</small>
      </div>
      <div class="d-flex justify-content-between mt-2">
        <small>Cantidad: {{ o.qty }}</small>
        <small class="fw-bold">Total: ${{ o.total }}</small>
      </div>
      <div class="mt-3 text-start">
        <a routerLink="/empleado-actualizar-estado" class="btn-detalles">Detalles</a>
      </div>
    </div>
  </div>
</ng-container>

<!-- USUARIO: un solo estado -->
<ng-template #userView>
  <div class="container text-center mt-5 estado-container">
    <h2 class="fw-bold">Estado de tu pedido</h2>
    <p class="text-muted">Estamos trabajando en tu comida 🍔</p>

    <div class="mt-5 text-start d-inline-block">
      <p><i class="fa-solid fa-circle-check estado-icon estado-realizado"></i> Pedido realizado</p>
      <p><i class="fa-solid fa-utensils estado-icon estado-preparacion"></i> En preparación</p>
      <p><i class="fa-solid fa-bell estado-icon estado-listo"></i> Listo para retirar</p>
    </div>

    <div class="mt-5 d-flex flex-column align-items-center gap-3">
      <a routerLink="/menu" class="btn btn-primary btn-lg w-50">Volver al menú</a>
      <a routerLink="/calificar" class="btn btn-danger btn-lg w-50">Calificar</a>
    </div>
  </div>
</ng-template>

<app-footer></app-footer>
