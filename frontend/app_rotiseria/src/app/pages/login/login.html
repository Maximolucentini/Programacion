<app-navbar></app-navbar>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">PoissonFood</h3>

    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required />
      </div>

      
      <button type="button" class="btn btn-danger w-100" (click)="irAlMenu()">Iniciar sesión</button>
    </form>

    <div class="mt-3 text-center">
      <p class="mb-2">¿No tienes una cuenta?
        <button class="btn btn-sm btn-outline-primary" (click)="irARegistro()">Regístrate</button>
      </p>
      <p>¿Sos administrador?
        <a routerLink="/admin" class="btn btn-sm btn-outline-secondary">Ingresá aquí</a>
      </p>
      
      <p>¿Sos empleado?
        <a routerLink="/empleado" class="btn btn-sm btn-outline-warning">Ingresá aquí</a>
      </p>
    </div>
  </div>
</div>
<app-footer></app-footer>
