<app-navbar></app-navbar>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card p-4 shadow" style="width: 100%; max-width: 420px;">
    <h3 class="text-center mb-4">PoissonFood</h3>

    
    <form [formGroup]="loginForm" (ngSubmit)="irLogin()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="ejemplo@correo.com"
          formControlName="email"
        />
        <div class="form-text text-danger"
             *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Ingresá un email válido.
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
        />
        <div class="form-text text-danger"
             *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          La contraseña es requerida.
        </div>
      </div>

      <button type="submit" class="btn btn-danger w-100">Iniciar sesión</button>
    </form>

    <div class="mt-3 text-center">
      <p class="mb-2">
        ¿No tienes una cuenta?
        <!-- RouterLink al registro -->
        <a class="btn btn-sm btn-outline-primary" routerLink="/registro">Regístrate</a>
      </p>
    </div>
  </div>
</div>
<app-footer></app-footer>
