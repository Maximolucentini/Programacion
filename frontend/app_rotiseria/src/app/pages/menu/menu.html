<app-navbar></app-navbar>

<div class="container mt-5">
  <div class="d-flex justify-content-center mb-3" *ngIf="ver">
    <a routerLink="/admin" class="btn btn-outline-secondary rounded-pill px-4">
      ← Volver al panel
    </a>
  </div>
  <h1 class="text-center" *ngIf="!ver">Menú</h1>
  <h1 class="text-center text-danger" *ngIf="ver">Editar menú (Admin)</h1>
  <p class="text-center mb-4">¡Ordena tu comida favorita!</p>

  <div class="d-flex justify-content-end mb-3" *ngIf="ver">
    <a routerLink="/agregar-producto" class="btn btn-outline-primary">+ Agregar producto</a>
  </div>

  <div class="input-group mb-4">
    <input type="text" class="form-control" placeholder="Buscar producto..." />
    <button class="btn btn-outline-secondary" type="button"><i class="fa fa-search"></i></button>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let p of products">
      <app-product-card
        [data]="p"
        [adminMode]="ver"
        (add)="addToCart($event)"
        (remove)="onRemove($event)"
        (toggle)="onToggle($event)">
      </app-product-card>
    </div>
  </div>
</div>

<app-footer></app-footer>
