<app-navbar></app-navbar>
<div style="max-width: 400px; margin: 2rem auto;">

  <!-- Header con volver -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <button
      class="btn btn-link p-0 d-flex align-items-center"
      style="text-decoration:none; color:#000; font-size:0.95rem;"
      (click)="volver()"
    >
      <i class="fa-solid fa-arrow-left me-2"></i>
      <span>Volver</span>
    </button>

    <h2 class="m-0 fw-bold" style="color:#e63939; font-size:1.25rem;">
      Calificar :
    </h2>

    <span style="width:40px;"></span>
  </div>

  <div class="text-muted text-center mb-3">
    Pedido N° {{ pedidoId() || 'xxxxxxxx' }}
  </div>

  <div class="card shadow-sm p-4" style="border-left: 4px solid #e63939; border-radius: 8px;">
    <div class="mb-4 text-center">
      <div class="fw-bold mb-2" style="color: #e63939; font-size: 1.1rem;">
        Comida:
      </div>

      <span
        *ngFor="let n of [1,2,3,4,5]"
        (click)="setComida(n)"
        style="font-size: 1.6rem; cursor: pointer; margin: 0 4px;"
      >
        <i
          class="fa-star"
          [class.fa-solid]="comida() >= n"
          [class.fa-regular]="comida() < n"
        ></i>
      </span>
    </div>

    <div class="mb-4 text-center">
      <div class="fw-bold mb-2" style="color: #e63939; font-size: 1.1rem;">
        Atencion:
      </div>

      <span
        *ngFor="let n of [1,2,3,4,5]"
        (click)="setAtencion(n)"
        style="font-size: 1.6rem; cursor: pointer; margin: 0 4px;"
      >
        <i
          class="fa-star"
          [class.fa-solid]="atencion() >= n"
          [class.fa-regular]="atencion() < n"
        ></i>
      </span>
    </div>

    <button
      class="btn w-100 mt-2"
      style="background-color:#e63939; color:#fff; font-weight:600;"
      (click)="finalizar()"
    >
      Finalizar
    </button>
  </div>
</div>

<app-footer></app-footer>
