<div class="container py-4">
    <!-- Botón volver -->
    <button routerLink="/promos-admin" class="btn btn-outline-secondary mb-3">
      ← Volver
    </button>
  
    <!-- Título -->
    <h2 class="text-danger fw-bold mb-4">Agregar nueva promoción</h2>
  
    <!-- Formulario -->
    <form>
      <div class="mb-3">
        <label for="tituloPromo" class="form-label">Título</label>
        <input
          type="text"
          class="form-control"
          id="tituloPromo"
          placeholder="Ej: 2x1 en hamburguesas"
        />
      </div>
  
      <div class="mb-3">
        <label for="descripcionPromo" class="form-label">Descripción</label>
        <textarea
          class="form-control"
          id="descripcionPromo"
          rows="3"
          placeholder="Texto de la promoción..."
        ></textarea>
      </div>
  
      <div class="mb-3">
        <label for="fechaPromo" class="form-label">Fecha</label>
        <input
          type="date"
          class="form-control"
          id="fechaPromo"
        />
      </div>
  
      <button type="submit" class="btn btn-danger">Agregar promoción</button>
    </form>
  </div>
