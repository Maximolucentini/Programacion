<div class="container py-4">
    <a [routerLink]="ver ? '/menu-admin' : '/menu-admin'" class="btn btn-outline-secondary mb-3">
      ← Volver
    </a>
  
    <h2 class="text-danger fw-bold mb-4">{{ titulo }}</h2>
  
    <!-- mismos campos para agregar/editar -->
    <form (submit)="$event.preventDefault()">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input class="form-control" placeholder="Ej: Hamburguesa clásica">
      </div>
  
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" rows="3" placeholder="Descripción del producto..."></textarea>
      </div>
  
      <div class="mb-3">
        <label class="form-label">Precio ($)</label>
        <input type="number" class="form-control" placeholder="2500">
      </div>
  
      <div class="mb-3">
        <label class="form-label">URL de imagen</label>
        <input class="form-control" placeholder="https://.../imagen.jpg">
      </div>
  
      <button type="submit" class="btn btn-danger">{{ submitLabel }}</button>
    </form>
  </div>
