<div class="container pt-4">
    <button routerLink="/admin" class="btn btn-outline-secondary mb-3">
      ← Volver al panel
    </button>
  </div>
  
  <div class="container py-4">
    <h2 class="mb-4 text-center text-danger fw-bold">Editar menú:</h2>
  
    <div class="row g-4">
  
      <!-- Producto 1 -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="assets/americanburger.jpg" class="card-img-top" alt="Hamburguesa 1" />
          <div class="card-body text-center">
            <h5 class="card-title">Cheeseburger Wendy's Burger</h5>
            <p class="text-warning">
              <i class="fa-solid fa-star"></i> 4.9 – 25 mins
            </p>
            <div class="d-flex justify-content-around mt-3">
              <button routerLink="/editar-producto" class="btn btn-edit">EDITAR</button>
              <button class="btn btn-delete">ELIMINAR</button>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Producto 2 -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="assets/chickenburger.jpg" class="card-img-top" alt="Hamburguesa 2" />
          <div class="card-body text-center">
            <h5 class="card-title">Hamburger Chicken Burger</h5>
            <p class="text-warning">
              <i class="fa-solid fa-star"></i> 4.6 – 22 mins
            </p>
            <div class="d-flex justify-content-around mt-3">
              <button routerLink="/editar-producto" class="btn btn-edit">EDITAR</button>
              <button class="btn btn-delete">ELIMINAR</button>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Producto 3 -->
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <img src="assets/bigburger.jpg" class="card-img-top" alt="Hamburguesa 3" />
          <div class="card-body text-center">
            <h5 class="card-title">Hamburger Veggie Burger</h5>
            <p class="text-warning">
              <i class="fa-solid fa-star"></i> 4.8 – 14 mins
            </p>
            <div class="d-flex justify-content-around mt-3">
              <button routerLink="/editar-producto" class="btn btn-edit">EDITAR</button>
              <button class="btn btn-delete">ELIMINAR</button>
            </div>
          </div>
        </div>
      </div>
  
    </div>
  
    <!-- Botón para agregar producto -->
    <button
      routerLink="/agregar-producto"
      class="btn btn-danger rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center"
      style="width: 60px; height: 60px; z-index: 1030;">
      <i class="fa-solid fa-plus fs-4"></i>
    </button>
  </div>
