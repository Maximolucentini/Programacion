<div class="container py-4">
    <!-- Botón volver -->
    <button routerLink="/menu-admin" class="btn btn-outline-secondary mb-3">
      ← Volver
    </button>
  
    <!-- Título -->
    <h2 class="text-danger fw-bold mb-4">Agregar nuevo producto</h2>
  
    <!-- Formulario -->
    <form>
      <div class="mb-3">
        <label for="nombreProducto" class="form-label">Nombre del producto</label>
        <input
          type="text"
          class="form-control"
          id="nombreProducto"
          placeholder="Ej: Hamburguesa clásica"
        />
      </div>
  
      <div class="mb-3">
        <label for="descripcionProducto" class="form-label">Descripción</label>
        <textarea
          class="form-control"
          id="descripcionProducto"
          rows="3"
          placeholder="Descripción del producto..."
        ></textarea>
      </div>
  
      <div class="mb-3">
        <label for="precioProducto" class="form-label">Precio ($)</label>
        <input
          type="number"
          class="form-control"
          id="precioProducto"
          placeholder="Ej: 2500"
        />
      </div>
  
      <div class="mb-3">
        <label for="imagenProducto" class="form-label">URL de imagen</label>
        <input
          type="text"
          class="form-control"
          id="imagenProducto"
          placeholder="https://ejemplo.com/imagen.jpg"
        />
      </div>
  
      <button type="submit" class="btn btn-danger">Agregar producto</button>
    </form>
  </div>
